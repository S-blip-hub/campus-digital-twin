name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Simulate the week, run SQL, draw figures, write viewer data
        run: python -m twin.build
      - name: Compile the viewer
        run: npx --yes -p typescript@5 tsc -p web/tsconfig.json
      - name: Tests
        run: python -m pytest -q
      - name: Commit regenerated outputs
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures layers web/data.js web/js
          git diff --cached --quiet || { git commit -m "Regenerate figures, layers and viewer data"; git push; }
